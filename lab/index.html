<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lab aberto · laborateliê</title>
<meta name="description" content="lab aberto · arquivo do laborateliê de Maia Oazem: estudos com humanos, ferramentas e projetos em desenvolvimento.">
<meta property="og:title" content="lab aberto · laborateliê">
<meta property="og:description" content="Arquivo do laborateliê de Maia Oazem.">
<meta name="theme-color" content="#f9ea8c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Instrument+Sans:wght@400;500;600&family=Courier+Prime&display=swap" rel="stylesheet">
<!--
  ============================================================
  LAB ABERTO · como atualizar
  ------------------------------------------------------------
  Esta página não precisa ser editada. Ela lê o arquivo
  itens.csv (na mesma pasta /lab/) e monta tudo sozinha.

  Para atualizar: edite o itens.csv e salve (commit).
  Colunas lidas (a ordem não importa, o nome sim):
    #               código: P-001, F-001...
    Categoria       vira uma seção (na ordem em que aparece)
    Fase            0, I, II...
    Título
    Subtítulo
    Descrição
    Reconhecimentos  "-" ou vazio = nada aparece
    Link             "-" ou vazio = sem link (abre sempre em nova aba)
    Imagem           nome do arquivo em /lab/images/ (ex.: clube.gif)
  Opcionais para a versão em inglês (se vazias, usa o PT):
    Título EN, Subtítulo EN, Descrição EN, Categoria EN,
    Reconhecimentos EN
  Separador , ou ; (Excel/Google Sheets) funciona dos dois jeitos.
  ============================================================
-->
<style>
:root{
  --rosa:#f6b4d0; --rosa-tinta:#c81e66;
  --amarelo:#f9ea8c; --amarelo-tinta:#7a6200;
  --papel:#fbf8f4; --tinta:#141414;
  --serifa:"Cormorant Garamond", Garamond, Georgia, serif;
  --grotesca:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"Courier Prime","Courier New",monospace;
  --margem:64px;
  /* papel da página: amarelo (padrão) ou branco */
  --fundo:var(--amarelo); --numero:var(--tinta);
  --cinza:color-mix(in srgb, var(--tinta) 58%, var(--fundo));
}
html[data-papel="branco"]{ --fundo:var(--papel); --numero:var(--amarelo-tinta); }
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--fundo);color:var(--tinta);-webkit-text-size-adjust:100%}
body{font-family:var(--grotesca);font-size:15px;line-height:1.42;max-width:1440px;margin:0 auto;padding:0 var(--margem) 64px}
a{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
em{font-style:italic}
.versal{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:500}
.mono{font-family:var(--mono)}
.fio{border-top:1px solid var(--tinta)}
.fio-grosso{border-top:2px solid var(--tinta)}

/* cabeço corrido */
.cabeco{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:14px 0;border-bottom:1px solid var(--tinta);margin-top:32px;border-top:1px solid var(--tinta)}
.cabeco nav{display:flex;gap:20px;flex-wrap:wrap}
.cabeco nav a{text-decoration:none}
.cabeco nav a:hover,.cabeco nav a[aria-current]{text-decoration:underline}
.chaves{display:flex;gap:18px;align-items:center}
.chave{display:flex;gap:6px}
.chave button{padding:0;opacity:.45}
.chave button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:3px}

/* abertura */
.abertura{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:72px 0 40px}
h1{font-family:var(--serifa);font-weight:300;font-size:clamp(88px,15vw,232px);line-height:.86;letter-spacing:-.02em;grid-column:1/-1}
.abertura p{font-size:24px;line-height:1.3;letter-spacing:-.01em;grid-column:2;text-indent:3em;max-width:30ch}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding:12px 0;border-top:1px solid var(--tinta);border-bottom:1px solid var(--tinta)}
.meta div span{display:block}
.meta .v{font-family:var(--serifa);font-size:26px;font-weight:400;line-height:1.1;color:var(--numero)}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px 10px;padding:22px 0 8px;align-items:center}
.filtros .versal{margin-right:8px}
.tag{font-family:var(--mono);font-size:13px;line-height:1;padding:6px 9px;border:1px solid var(--tinta);white-space:nowrap}
.filtros button.tag[aria-pressed="true"]{background:var(--tinta);color:var(--fundo)}

/* seções */
section{margin-top:56px}
.secao{display:grid;grid-template-columns:96px 1fr auto;align-items:end;gap:28px;padding:10px 0 12px;border-top:2px solid var(--tinta)}
.secao .n{font-family:var(--serifa);font-weight:300;font-size:44px;line-height:.9;color:var(--numero)}
.secao h2{font-family:var(--serifa);font-weight:300;font-size:clamp(40px,5vw,64px);line-height:.95;letter-spacing:-.01em}
.secao .conta{padding-bottom:4px}

/* linhas do arquivo */
/* cada item é uma pasta: a borda de cima tem uma aba com o código */
.item{position:relative;display:grid;grid-template-columns:minmax(240px,3fr) minmax(260px,4fr) 92px 40px;gap:28px;margin-top:40px;padding:20px 0 24px;border-top:1px solid var(--tinta)}
.item:last-child{border-bottom:1px solid var(--tinta)}
.aba{position:absolute;top:-28px;left:var(--aba,0px);height:28px;padding:0 26px;display:flex;align-items:center;font-family:var(--mono);font-size:13px;z-index:1}
.aba::before{content:"";position:absolute;inset:0;border:1px solid var(--tinta);border-bottom:0;background:var(--fundo);transform:perspective(26px) rotateX(9deg);transform-origin:bottom;z-index:-1}
.aba::after{content:"";position:absolute;left:1px;right:1px;bottom:-1px;height:1px;background:var(--fundo)}
.item h3{font-family:var(--serifa);font-weight:400;font-size:30px;line-height:1.02;letter-spacing:-.01em}
.item h3.sem-link{color:var(--cinza)}
.item .sub{font-family:var(--serifa);font-style:italic;font-size:20px;line-height:1.15;margin-top:6px;color:var(--cinza)}
.item .img{display:block;margin-top:18px;max-width:320px;width:100%;height:auto}
.item .img.monotom{filter:grayscale(1) contrast(1.05);mix-blend-mode:multiply}
.item .desc{max-width:62ch}
.item .desc strong{font-weight:600}
.item .rec{margin-top:10px;font-weight:500}
.item .rec .versal{margin-right:6px;font-size:11px}
.item .fase{padding-top:4px}
.item .ir{font-family:var(--serifa);font-size:30px;line-height:1;text-decoration:none;text-align:right}
.item .ir:hover{font-style:italic}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline;text-decoration-thickness:1px}

.aviso{font-family:var(--mono);padding:48px 0}

/* pé */
footer{margin-top:96px;border-top:1px solid var(--tinta);padding-top:18px;display:grid;grid-template-columns:1fr auto;gap:16px 28px;align-items:center}
.assinatura{display:flex;align-items:center;gap:12px;font-family:var(--serifa);font-size:24px}
.assinatura img{width:22px;height:22px}
footer .dir{text-align:right}
footer .fonte{grid-column:1/-1;text-align:right}

@media (max-width:900px){
  :root{--margem:20px}
  .abertura{grid-template-columns:1fr;padding:48px 0 28px}
  .abertura p{grid-column:1;font-size:20px}
  .meta{grid-template-columns:1fr 1fr}
  .secao{grid-template-columns:56px 1fr auto;gap:14px}
  .secao .n{font-size:32px}
  .secao h2{font-size:34px}
  .secao .conta{white-space:nowrap}
  .item{grid-template-columns:1fr auto;gap:8px 16px}
  .aba{left:0 !important}
  .item .fase{grid-column:2;grid-row:1;padding:0}
  .item .titulo,.item .corpo{grid-column:1/-1}
  .item .ir{grid-column:1/-1;text-align:left;font-size:24px}
  .cabeco{flex-direction:column;align-items:flex-start;gap:10px}
  footer{grid-template-columns:1fr}
  footer .dir{text-align:left}
}
@media print{ .filtros,.chaves{display:none} html{background:#fff} }
</style>
</head>
<body>

<header class="cabeco">
  <nav aria-label="menu">
    <a href="/">Maia Oazem</a>
    <a href="/lab/" aria-current="page">laborateliê · lab aberto</a>
  </nav>
  <div class="chaves">
    <div class="chave" role="group" aria-label="papel">
      <button data-papel="amarelo">amarelo</button><span>·</span><button data-papel="branco">branco</button>
    </div>
    <div class="chave" role="group" aria-label="idioma">
      <button data-lang="pt">PT-BR</button><span>·</span><button data-lang="en">EN</button>
    </div>
  </div>
</header>

<div class="abertura">
  <h1>lab <em>aberto</em></h1>
  <p data-t="intro"></p>
</div>

<div class="meta" id="meta"></div>
<div class="filtros" id="filtros"></div>
<main id="arquivo"><p class="aviso">…</p></main>

<footer>
  <div class="assinatura">
    <img src="/lab/marca/arquivos/laboratelie-fagulha-tinta.svg" alt="">
    <span>outra coisa é <em>possível</em></span>
  </div>
  <div class="dir">CC BY-NC-SA 4.0 · <span data-t="cif"></span></div>
  <div class="fonte mono">
    <span id="atualizado"></span>
  </div>
</footer>

<script>
/* ---------- configuração ---------- */
const CSV_URL = "itens.csv";   // pode ser também o link "publicar na web → CSV" de uma Planilha Google
const PASTA_IMAGENS = "images/"; // nome na coluna Imagem → /lab/images/nome
const MONOTOM = true;            // imagens em monotom (regra do DS); false = cores originais

const T = {
  pt:{intro:"Arquivo do laborateliê: estudos com humanos, ferramentas e projetos em desenvolvimento, do rascunho ao lançamento.",
      itens:"itens", cats:"categorias", fases:"fases", fonte_l:"fonte",
      todos:"todos", filtrar:"filtrar", fase:"fase", rec:"reconhecimentos", abrir:"abrir",
      cif:"Criatividade Informada por Futuros",
      atual:"atualizado em", erro:"não foi possível ler itens.csv."},
  en:{intro:"The laborateliê archive: human studies, tools and projects in development, from draft to launch.",
      itens:"items", cats:"categories", fases:"phases", fonte_l:"source",
      todos:"all", filtrar:"filter", fase:"phase", rec:"recognition", abrir:"open",
      cif:"Futures-Informed Creativity",
      atual:"updated", erro:"could not read itens.csv."}
};
const ROMANOS=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];

/* ---------- estado ---------- */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const q=new URLSearchParams(location.search);
let lang = q.get("lang") || store.get("lab-lang") || "pt";
let papel = q.get("papel") || store.get("lab-papel") || "amarelo";
let filtro = "todos";
let itens = [], modificado = null;

/* ---------- leitor de CSV (aspas, quebras de linha, , ou ;) ---------- */
function lerCSV(txt){
  txt = txt.replace(/^﻿/,"");
  const primeira = txt.split(/\r?\n/)[0];
  const sep = (primeira.split(";").length > primeira.split(",").length) ? ";" : ",";
  const linhas=[]; let linha=[], campo="", aspas=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(aspas){
      if(c==='"'){ if(txt[i+1]==='"'){campo+='"';i++;} else aspas=false; }
      else campo+=c;
    } else if(c==='"') aspas=true;
    else if(c===sep){ linha.push(campo); campo=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&txt[i+1]==="\n") i++; linha.push(campo); linhas.push(linha); linha=[]; campo=""; }
    else campo+=c;
  }
  if(campo!==""||linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas.filter(l=>l.some(v=>v.trim()!==""));
}
const chave = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9#]+/g," ").trim();
const vazio = v => !v || /^[-–—]$/.test(v.trim());

function paraItens(linhas){
  const cab = linhas[0].map(chave);
  const idx = nome => cab.indexOf(chave(nome));
  return linhas.slice(1).map(l=>{
    const g = nome => { const i=idx(nome); return i<0 ? "" : (l[i]||"").trim(); };
    const par = nome => ({pt:g(nome), en:g(nome+" EN")});
    return { cod:g("#"), fase:g("Fase"), link:g("Link"), img:g("Imagem"),
      cat:par("Categoria"), titulo:par("Título"), sub:par("Subtítulo"),
      desc:par("Descrição"), rec:par("Reconhecimentos") };
  }).filter(it=>it.titulo.pt||it.cod);
}

/* ---------- desenho ---------- */
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const txt = p => esc(lang==="en" && !vazio(p.en) ? p.en : p.pt);
const t = k => T[lang][k];

function categorias(){
  const vistas=[];
  itens.forEach(it=>{ if(!vistas.includes(it.cat.pt)) vistas.push(it.cat.pt); });
  return vistas;
}

function desenhar(){
  document.documentElement.lang = lang==="en" ? "en" : "pt-BR";
  document.documentElement.dataset.papel = papel;
  document.querySelector('meta[name=theme-color]').content = papel==="branco" ? "#fbf8f4" : "#f9ea8c";
  document.querySelectorAll("[data-t]").forEach(el=>el.innerHTML=t(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll("[data-papel]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.papel===papel));
  if(!itens.length) return;

  nItem = 0;
  const cats = categorias();
  const nomeCat = pt => { const it=itens.find(i=>i.cat.pt===pt); return txt(it.cat); };
  const fases = [...new Set(itens.map(i=>i.fase).filter(f=>!vazio(f)))]
    .sort((a,b)=>(a==="0"?0:ROMANOS.indexOf(a)+1)-(b==="0"?0:ROMANOS.indexOf(b)+1));

  document.getElementById("meta").innerHTML =
    `<div><span class="versal">${t("itens")}</span><span class="v">${String(itens.length).padStart(2,"0")}</span></div>
     <div><span class="versal">${t("cats")}</span><span class="v">${String(cats.length).padStart(2,"0")}</span></div>
     <div><span class="versal">${t("fases")}</span><span class="v">${fases.join(" · ")}</span></div>
     <div><span class="versal">${t("fonte_l")}</span><span class="v mono" style="font-size:17px;padding-top:6px">itens.csv</span></div>`;

  document.getElementById("filtros").innerHTML =
    `<span class="versal">${t("filtrar")}</span>` +
    ["todos",...cats].map(c=>`<button class="tag" data-filtro="${esc(c)}" aria-pressed="${c===filtro}">${c==="todos"?t("todos"):nomeCat(c)}</button>`).join("");
  document.querySelectorAll("[data-filtro]").forEach(b=>b.onclick=()=>{filtro=b.dataset.filtro;desenhar();});

  document.getElementById("arquivo").innerHTML = cats.filter(c=>filtro==="todos"||c===filtro).map(c=>{
    const n = cats.indexOf(c);
    const lista = itens.filter(i=>i.cat.pt===c);
    return `<section>
      <div class="secao"><span class="n">${ROMANOS[n]||n+1}</span><h2>${nomeCat(c)}</h2><span class="conta versal">${String(lista.length).padStart(2,"0")} ${t("itens")}</span></div>
      ${lista.map(linhaItem).join("")}
    </section>`;
  }).join("");

  document.getElementById("atualizado").textContent = modificado
    ? `${t("atual")} ${modificado.toLocaleDateString("pt-BR").replace(/\//g,".")}` : "";
}

// negrito na primeira frase da descrição (até o primeiro ":" "." "?" ou "!")
function descricao(d){
  const m = d.match(/^([\s\S]*?[.:?!])(\s+[\s\S]*)?$/);
  if(!m) return esc(d);
  return `<strong>${esc(m[1])}</strong>${esc(m[2]||"")}`;
}
const ABAS = ["0px","140px","280px","420px"];
let nItem = 0;
function linhaItem(it){
  const temLink = !vazio(it.link);
  const fora = 'target="_blank" rel="noopener"';
  const titulo = temLink ? `<a href="${esc(it.link)}" ${fora}>${txt(it.titulo)}</a>` : txt(it.titulo);
  const src = vazio(it.img) ? "" : (/^(https?:)?\/\//.test(it.img) || it.img.startsWith("/") ? it.img : PASTA_IMAGENS + it.img);
  const imagem = src ? `<img class="img${MONOTOM?" monotom":""}" src="${esc(src)}" alt="${txt(it.titulo)}" loading="lazy" onerror="this.remove()">` : "";
  const aba = ABAS[nItem++ % ABAS.length];
  return `<article class="item">
    <div class="aba" style="--aba:${aba}">${esc(it.cod)}</div>
    <div class="titulo"><h3${temLink?"":' class="sem-link"'}>${titulo}</h3>${vazio(it.sub.pt)?"":`<p class="sub">${txt(it.sub)}</p>`}${imagem}</div>
    <div class="corpo">
      ${vazio(it.desc.pt)?"":`<p class="desc">${descricao(lang==="en"&&!vazio(it.desc.en)?it.desc.en:it.desc.pt)}</p>`}
      ${vazio(it.rec.pt)?"":`<p class="rec"><span class="versal">${t("rec")}</span>${txt(it.rec)}</p>`}
    </div>
    <div class="fase">${vazio(it.fase)?"":`<span class="tag">${t("fase")} ${esc(it.fase)}</span>`}</div>
    ${temLink?`<a class="ir" href="${esc(it.link)}" ${fora} aria-label="${t("abrir")}">↗</a>`:"<span></span>"}
  </article>`;
}

/* ---------- chaves ---------- */
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("lab-lang",lang);desenhar();});
document.querySelectorAll("[data-papel]").forEach(b=>b.onclick=()=>{papel=b.dataset.papel;store.set("lab-papel",papel);desenhar();});

/* ---------- carregar ---------- */
desenhar();
fetch(CSV_URL,{cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw 0; const lm=r.headers.get("last-modified"); if(lm) modificado=new Date(lm); return r.text(); })
  .then(s=>{ itens=paraItens(lerCSV(s)); desenhar(); })
  .catch(()=>{ document.getElementById("arquivo").innerHTML=`<p class="aviso">${t("erro")}</p>`; });
</script>
</body>
</html>
